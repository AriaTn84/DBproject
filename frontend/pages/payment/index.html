<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت بلیط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="../home/index.html" class="text-2xl font-bold text-blue-600">Raahi</a>
                </div>
                 <div class="flex items-center">
                    <a href="../profile/my_profile/index.html" id="profile-link" class="flex items-center text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-md text-sm font-medium">
                        <span>پروفایل من</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-12 mb-12 px-4">
        <h1 class="text-3xl font-bold text-center mb-8">صورت‌حساب و پرداخت</h1>

        <div class="max-w-2xl mx-auto grid grid-cols-1 gap-8">
            <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
                <h2 class="text-xl font-bold mb-6">۱. اطلاعات مسافر</h2>
                <div id="passenger-info">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-500 mb-1">نام</label>
                            <p id="passenger-first-name" class="font-semibold text-lg p-3 bg-slate-100 rounded-lg">در حال بارگذاری...</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-500 mb-1">نام خانوادگی</label>
                            <p id="passenger-last-name" class="font-semibold text-lg p-3 bg-slate-100 rounded-lg"></p>
                        </div>
                    </div>
                    <div>
                        <label for="national_id" class="block text-sm font-medium text-slate-700 mb-2">کد ملی (ضروری)</label>
                        <input type="text" id="national_id" name="national_id" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required pattern="\d{10}" title="کد ملی باید ۱۰ رقم باشد" placeholder="لطفا کد ملی خود را وارد کنید">
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
                <h2 class="text-xl font-bold mb-4">۲. صورت‌حساب</h2>
                <div id="ticket-details" class="border-b pb-4 mb-4">
                    <p class="text-slate-500">در حال بارگذاری اطلاعات...</p>
                </div>
                <div class="flex justify-between items-center font-bold text-lg">
                    <span>مبلغ قابل پرداخت:</span>
                    <span id="total-price" class="text-blue-600"></span>
                </div>
                <button id="pay-button" class="w-full mt-8 bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition-all flex items-center justify-center">
                    پرداخت نهایی با کیف پول
                </button>
                <div id="message-box" class="mt-4 text-center text-sm p-3 rounded-lg hidden"></div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/payment.js"></script>
</body>
</html>
