<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغو رزرو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">لغو و استرداد وجه</h1>
            <p class="text-gray-500 mt-2">برای لغو رزرو، شناسه بلیط خود را وارد کنید.</p>
        </div>

        <div class="space-y-6">
            <div class="form-group">
                <label for="booking-id" class="block mb-2 text-sm font-medium text-gray-700">شناسه رزرو (Booking ID)</label>
                <input type="text" id="booking-id" name="booking-id"
                       class="w-full px-4 py-2 text-gray-700 bg-gray-50 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-300"
                       placeholder="مثال: 12345">
            </div>

            <button id="cancel-button"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition duration-300 ease-in-out">
                    لغو رزرو
            </button>
        </div>

        <div id="message" class="mt-6 text-center text-sm font-medium"></div>
    </div>

    <script src="../../../assets/js/cancel_booking.js"></script>
</body>
</html>
