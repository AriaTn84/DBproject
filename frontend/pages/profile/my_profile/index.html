<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <a href="../../home/index.html" class="text-2xl font-bold text-blue-600">Raahi</a>
                    </div>
                </div>
                <div class="flex items-center">
                     <a id="logout-link" href="#" class="flex items-center text-red-600 hover:bg-red-100 mr-2 px-3 py-2 rounded-md text-sm font-medium">
                        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H3"></path></svg>
                        <span>خروج</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-36 pt-24">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <aside class="lg:col-span-1">
                <div class="bg-white p-4 rounded-xl shadow-md border border-slate-200">
                    <ul class="space-y-1">
                        <li><a href="index.html" class="flex items-center px-4 py-3 text-blue-700 bg-blue-50 rounded-lg font-semibold">
                            <svg class="w-5 h-5 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span>حساب کاربری</span></a>
                        </li>
                        <li><a href="#" class="flex items-center px-4 py-3 text-slate-600 hover:bg-slate-100 rounded-lg">
                            <svg class="w-5 h-5 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            <span>خریدهای من</span></a>
                        </li>
                         <li><a href="#" class="flex items-center px-4 py-3 text-slate-600 hover:bg-slate-100 rounded-lg">
                            <svg class="w-5 h-5 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            <span>موجودی و اعتبار</span></a>
                        </li>
                    </ul>
                </div>
            </aside>

            <main class="lg:col-span-3">
                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 mb-8 flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="w-16 h-16 rounded-full bg-slate-200 flex items-center justify-center text-2xl text-slate-500">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <div class="mr-4">
                            <h2 id="user-fullname" class="text-xl font-bold text-slate-800">نام کاربر...</h2>
                            <p id="user-phone-display" class="text-slate-500">شماره موبایل...</p>
                        </div>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500">موجودی حساب</p>
                        <p id="wallet-balance" class="text-lg font-bold text-green-600">0 تومان</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 mb-8">
                    <h3 class="text-lg font-semibold text-slate-800 mb-4 border-b pb-3">اطلاعات حساب کاربری</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-sm text-slate-500">شماره موبایل</p>
                                <p id="user-phone" class="font-medium">...</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-sm text-slate-500">ایمیل</p>
                                <p id="user-email" class="font-medium">...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <h3 class="text-lg font-semibold text-slate-800">اطلاعات شخصی</h3>
                        <a href="../edit_profile/index.html" class="text-sm text-blue-600 font-semibold">ویرایش اطلاعات</a>
                    </div>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <p class="text-sm text-slate-500">نام و نام خانوادگی</p>
                            <p id="personal-fullname" class="font-medium">...</p>
                        </div>
                         <div class="flex justify-between items-center">
                            <p class="text-sm text-slate-500">تاریخ تولد</p>
                            <p id="date-of-birth" class="font-medium">—</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../../../assets/js/profile.js"></script>
</body>
</html>
