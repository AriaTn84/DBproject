<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب کاربری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <a href="../../home/index.html" class="text-2xl font-bold text-blue-600">Raahi</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="../../home/index.html" class="flex items-center text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-md text-sm font-medium">
                        <span>بازگشت به صفحه اصلی</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen flex flex-col items-center justify-center pt-20 px-4">
        <div class="w-full max-w-md">
            <!-- فرم اول: ارسال ایمیل -->
            <div id="email-step" class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 transition-all duration-500">
                <h2 class="text-2xl font-bold text-center text-slate-900 mb-2">ورود به حساب کاربری</h2>
                <p class="text-center text-slate-500 mb-6">برای ورود، ایمیل خود را وارد کنید.</p>
                <form id="send-otp-form">
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">ایمیل</label>
                        <input type="email" id="email" placeholder="example@mail.com" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" id="send-otp-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-all duration-300">
                        دریافت کد
                    </button>
                </form>
                <p class="text-center text-sm text-slate-600 mt-6">
                    حساب کاربری ندارید؟
                    <!-- ✅ تغییر: آدرس لینک ثبت‌نام بر اساس ساختار پوشه‌ها اصلاح شد -->
                    <a href="../signup/index.html" class="font-medium text-blue-600 hover:underline">ثبت‌نام کنید</a>
                </p>
            </div>

            <!-- فرم دوم: تایید کد (در ابتدا مخفی است) -->
            <div id="otp-step" class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 transition-all duration-500 hidden">
                <h2 class="text-2xl font-bold text-center text-slate-900 mb-2">تایید کد</h2>
                <p class="text-center text-slate-500 mb-6">کد ۶ رقمی ارسال شده به ایمیل خود را وارد کنید.</p>
                <form id="verify-otp-form">
                    <div class="mb-4">
                        <label for="otp" class="block text-sm font-medium text-slate-700 mb-2">کد تایید</label>
                        <input type="text" id="otp" inputmode="numeric" maxlength="6" class="w-full p-3 text-center tracking-[1em] border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" id="verify-otp-btn" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-700 transition-all duration-300">
                        تایید و ورود
                    </button>
                </form>
                 <p class="text-center text-sm text-slate-600 mt-6">
                    ایمیل را اشتباه وارد کردید؟
                    <a href="#" id="back-to-email" class="font-medium text-blue-600 hover:underline">بازگشت</a>
                </p>
            </div>

            <!-- بخش نمایش پیام‌های خطا یا موفقیت -->
            <div id="message-box" class="mt-4 text-center text-sm p-3 rounded-lg"></div>
        </div>
    </div>

    <script src="../../../assets/js/login.js"></script>
</body>
</html>
