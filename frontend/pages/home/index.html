<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هوشمند بلیط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <a href="index.html" class="text-2xl font-bold text-blue-600">Raahi</a>
                    </div>
                    <div class="hidden md:block">
                        <div class="mr-10 flex items-baseline space-x-4 space-x-reverse">
                            <a href="#" class="text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-md text-sm font-medium">بلیط هواپیما</a>
                            <a href="#" class="text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-md text-sm font-medium">بلیط قطار</a>
                        </div>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="#" class="flex items-center text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-md text-sm font-medium">
                        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span>پروفایل من</span>
                    </a>
                    <a href="../auth/login/index.html" class="flex items-center text-gray-700 hover:bg-gray-100 mr-2 px-3 py-2 rounded-md text-sm font-medium">
                         <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        <span>ورود | ثبت‌نام</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-36 pt-32">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 ">سامانه هوشمند جستجوی بلیط</h1>
            <p class="text-slate-600 mt-2">بهترین قیمت‌ها را برای سفر خود پیدا کنید.</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 mb-8">
            <form id="search-form">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <input type="text" id="departure_city" placeholder="شهر مبدأ" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" id="arrival_city" placeholder="شهر مقصد" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    <input type="date" id="departure_date" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                </div>
                <details class="group">
                    <summary class="cursor-pointer text-blue-600 font-semibold mb-4" >فیلترهای بیشتر</summary>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <select id="vehicle_type" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">همه وسایل نقلیه</option>
                            <option value="Airplane">هواپیما</option>
                            <option value="Train">قطار</option>
                            <option value="Bus">اتوبوس</option>
                        </select>
                        <input type="number" id="min_cost" placeholder="حداقل قیمت" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <input type="number" id="max_cost" placeholder="حداکثر قیمت" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <input type="text" id="company_name" placeholder="نام شرکت" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <input type="time" id="departure_time" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <input type="text" id="travel_class" placeholder="کلاس سفر (مثلا: Economy)" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </details>
                <div class="mt-6 text-center">
                    <button type="submit" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition-all duration-300 transform hover:scale-105 shadow-md">
                        جستجو کن
                    </button>
                </div>
            </form>
        </div>

        <main>
            <div id="loading" class="hidden text-center py-8">
                <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2 text-slate-600">در حال یافتن بهترین سفرها برای شما...</p>
            </div>
            <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </main>
    </div>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
